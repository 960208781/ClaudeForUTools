<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClaudeManager — Claude Code 工作台</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/terminal.css">
</head>
<body>
  <div class="workbench">
    <!-- ============ 活动栏 ============ -->
    <nav class="activity-bar" id="activityBar">
      <div class="activity-logo" title="ClaudeManager">
        <span class="activity-logo-icon">🤖</span>
      </div>
      <ul class="activity-items" id="activityItems">
        <li class="activity-item active" data-page="dashboard" title="仪表盘">
          <span class="activity-icon">🏠</span><span class="activity-label">仪表盘</span>
        </li>
        <li class="activity-item" data-page="terminal" title="对话">
          <span class="activity-icon">💬</span><span class="activity-label">对话</span>
        </li>
        <li class="activity-item" data-page="model" title="模型">
          <span class="activity-icon">🧠</span><span class="activity-label">模型</span>
        </li>
        <li class="activity-item" data-page="config" title="配置">
          <span class="activity-icon">⚙️</span><span class="activity-label">配置</span>
        </li>
        <li class="activity-separator"></li>
        <li class="activity-item" data-page="mcp" title="MCP 服务器">
          <span class="activity-icon">🔌</span><span class="activity-label">MCP</span>
        </li>
        <li class="activity-item" data-page="hooks" title="Hooks">
          <span class="activity-icon">🪝</span><span class="activity-label">Hooks</span>
        </li>
        <li class="activity-item" data-page="commands" title="命令">
          <span class="activity-icon">📝</span><span class="activity-label">命令</span>
        </li>
        <li class="activity-item" data-page="skills" title="Skills">
          <span class="activity-icon">✨</span><span class="activity-label">Skills</span>
        </li>
        <li class="activity-item" data-page="market" title="市场">
          <span class="activity-icon">🏪</span><span class="activity-label">市场</span>
        </li>
        <li class="activity-separator"></li>
        <li class="activity-item" data-page="sessions" title="会话历史">
          <span class="activity-icon">📂</span><span class="activity-label">会话</span>
        </li>
        <li class="activity-item" data-page="gateway" title="网关">
          <span class="activity-icon">🌐</span><span class="activity-label">网关</span>
        </li>
        <li class="activity-item" data-page="monitor" title="监控">
          <span class="activity-icon">📊</span><span class="activity-label">监控</span>
        </li>
        <li class="activity-item" data-page="tips" title="最佳实践">
          <span class="activity-icon">💡</span><span class="activity-label">实践</span>
        </li>
        <li class="activity-item" data-page="setup" title="安装诊断">
          <span class="activity-icon">🔧</span><span class="activity-label">诊断</span>
        </li>
      </ul>
      <button class="activity-collapse" id="activityCollapse" title="折叠/展开侧栏">
        <span id="collapseIcon">‹</span>
      </button>
    </nav>

    <!-- ============ 主区域 ============ -->
    <div class="workbench-main">
      <!-- 顶部命令栏 -->
      <header class="command-bar">
        <div class="command-bar-left">
          <span class="breadcrumb" id="pageTitle">仪表盘</span>
          <span class="scope-tag global" id="scopeTag">🌍 全局</span>
        </div>
        <div class="command-bar-center">
          <button class="palette-trigger" id="paletteTrigger" title="命令面板 (Ctrl+P)">
            <span class="palette-icon">🔍</span>
            <span class="palette-text">搜索页面或操作...</span>
            <kbd class="kbd">⌘P</kbd>
          </button>
        </div>
        <div class="command-bar-right">
          <div class="scope-switch" id="topbarScope">
            <button class="scope-btn active" id="scopeToggleGlobal" title="全局模式 (~/.claude/)">🌍</button>
            <button class="scope-btn" id="scopeToggleProject" title="项目级模式">📁</button>
            <span class="scope-project-label" id="scopeProjectLabel" style="display:none"></span>
            <button class="btn-icon ghost" id="scopeSelectProject" style="display:none" title="切换项目目录">⇄</button>
          </div>
          <button class="btn-icon ghost" id="themeToggle" title="切换主题 (暗/亮)">🌓</button>
        </div>
      </header>

      <!-- 内容区 -->
      <div class="content" id="content"></div>

      <!-- 底部状态栏 -->
      <footer class="status-bar" id="statusBar">
        <div class="status-bar-left">
          <span class="status-item" id="sbClaude"><span class="dot"></span>检测中…</span>
          <span class="status-sep">|</span>
          <span class="status-item scope" id="sbScope">🌍 全局</span>
          <span class="status-sep">|</span>
          <span class="status-item project" id="sbProject" style="display:none">📁 —</span>
        </div>
        <div class="status-bar-right">
          <span class="status-item" id="sbSessions" title="活动会话数">💬 0</span>
          <span class="status-sep">|</span>
          <span class="status-item" id="sbTime"></span>
        </div>
      </footer>
    </div>
  </div>

  <!-- 命令面板 -->
  <div class="palette-overlay" id="paletteOverlay" style="display:none">
    <div class="palette" id="palette">
      <div class="palette-input-wrap">
        <span class="palette-icon">🔍</span>
        <input class="palette-input" id="paletteInput" placeholder="输入页面名或操作（如 MCP、安装、模型）…" autocomplete="off" />
        <kbd class="kbd">esc</kbd>
      </div>
      <div class="palette-results" id="paletteResults"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/model.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mcp.js"></script>
  <script src="js/hooks.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/market.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/monitor.js"></script>
  <script src="js/tips.js"></script>
  <script src="js/gateway.js"></script>
  <script src="js/setup.js"></script>
</body>
</html>
