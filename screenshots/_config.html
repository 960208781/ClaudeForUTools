<!DOCTYPE html><html><head><meta charset="UTF-8"><style>/* ============================================================
   Claude Manager — 主样式表 v2
   专业、紧凑、暗色优先
   ============================================================ */

:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-hover: #30363d;
  --bg-active: #388bfd22;
  --bg-input: #0d1117;

  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-tertiary: #6e7681;
  --text-muted: #484f58;

  --border-color: #30363d;
  --border-light: #3a404a;

  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --accent-bg: rgba(88, 166, 255, 0.12);

  --success: #3fb950;
  --success-bg: rgba(63, 185, 80, 0.12);
  --warning: #d29922;
  --warning-bg: rgba(210, 153, 34, 0.12);
  --danger: #f85149;
  --danger-bg: rgba(248, 81, 73, 0.12);
  --info: #58a6ff;
  --info-bg: rgba(88, 166, 255, 0.12);

  --purple: #bc8cff;
  --purple-bg: rgba(188, 140, 255, 0.12);
  --green: #3fb950;
  --green-bg: rgba(63, 185, 80, 0.12);
  --orange: #d29922;
  --orange-bg: rgba(210, 153, 34, 0.12);

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;

  --shadow-sm: 0 1px 0 rgba(0,0,0,0.2);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);

  --transition: 0.15s ease;
  --font-mono: "JetBrains Mono","Fira Code","SF Mono",Consolas,monospace;
  --font-sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body.light-theme {
  --bg-primary: #ffffff;
  --bg-secondary: #f6f8fa;
  --bg-tertiary: #eaeef2;
  --bg-hover: #d0d7de;
  --bg-active: #ddf4ff;
  --bg-input: #ffffff;
  --text-primary: #1f2328;
  --text-secondary: #656d76;
  --text-tertiary: #8c959f;
  --text-muted: #afb8c1;
  --border-color: #d0d7de;
  --border-light: #e6eaee;
  --shadow-sm: 0 1px 0 rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --accent: #0969da;
  --accent-hover: #0550ae;
  --accent-bg: rgba(9,105,218,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; overflow: hidden;
  font-family: var(--font-sans); font-size: 13px;
  background: var(--bg-primary); color: var(--text-primary);
  -webkit-font-smoothing: antialiased; user-select: none;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* === 主布局 === */
.app { display: flex; height: 100vh; overflow: hidden; }

/* === 侧边栏 === */
.sidebar {
  width: 48px; flex-shrink: 0;
  background: var(--bg-secondary); border-right: 1px solid var(--border-color);
  display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 1px;
  z-index: 10; overflow: hidden; transition: width var(--transition);
}

.sidebar.expanded { width: 170px; align-items: stretch; padding: 6px 5px; }

.sidebar-logo {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; margin-bottom: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, #6366f1, #d97757);
}

.nav-item {
  width: 36px; height: 36px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-tertiary);
  font-size: 15px; flex-shrink: 0; position: relative;
  transition: all var(--transition);
}

.sidebar.expanded .nav-item {
  width: 100%; justify-content: flex-start; padding: 0 8px; gap: 8px;
  font-size: 12px; height: 34px;
}

.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active { background: var(--accent-bg); color: var(--accent); }
.nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 50%;
  transform: translateY(-50%); width: 2px; height: 18px;
  background: var(--accent); border-radius: 0 1px 1px 0;
}

.nav-item .nav-label { display: none; font-weight: 500; white-space: nowrap; }
.sidebar.expanded .nav-item .nav-label { display: inline; }
.nav-item .nav-icon { font-style: normal; width: 18px; text-align: center; flex-shrink: 0; }
.sidebar-spacer { flex: 1; }

.sidebar-toggle {
  width: 36px; height: 32px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-tertiary); font-size: 14px;
  flex-shrink: 0; transition: all var(--transition);
}

.sidebar.expanded .sidebar-toggle { width: 100%; }
.sidebar-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }

/* === 主内容区 === */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* === 顶部状态栏 === */
.topbar {
  height: 36px; background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; padding: 0 14px; gap: 10px; flex-shrink: 0;
}

.topbar-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.topbar-spacer { flex: 1; }

.topbar-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--text-secondary);
}

.status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 500;
  background: var(--bg-tertiary); color: var(--text-secondary);
}

.status-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); }
.status-badge.success .dot { background: var(--success); }
.status-badge.warning .dot { background: var(--warning); }
.status-badge.danger .dot { background: var(--danger); }
.status-badge.info .dot { background: var(--info); }
.status-badge.accent { background: var(--accent-bg); color: var(--accent); }
.status-badge.purple { background: var(--purple-bg); color: var(--purple); }

/* === 内容区 === */
.content { flex: 1; overflow-y: auto; padding: 16px; }
.content.no-padding { padding: 0; }

/* === 页面 === */
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* === 卡片 === */
.card {
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); padding: 14px; transition: all var(--transition);
}

.card:hover { border-color: var(--border-light); }
.card-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
}

.card-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.card-subtitle { font-size: 10px; color: var(--text-tertiary); margin-top: 1px; }

/* === 网格 === */
.grid { display: grid; gap: 12px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 700px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

/* === 按钮 === */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 5px 10px; border: 1px solid var(--border-color); border-radius: 6px;
  background: var(--bg-tertiary); color: var(--text-primary);
  font-size: 11px; font-weight: 500; cursor: pointer;
  transition: all var(--transition); font-family: var(--font-sans); white-space: nowrap;
}

.btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--bg-hover); }
.btn.sm { padding: 3px 8px; font-size: 10px; }
.btn.lg { padding: 8px 16px; font-size: 13px; }
.btn.icon { padding: 5px; width: 28px; height: 28px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* === 输入框 === */
.input, .textarea, .select {
  background: var(--bg-input); border: 1px solid var(--border-color);
  border-radius: 6px; padding: 5px 8px; color: var(--text-primary);
  font-size: 12px; font-family: var(--font-sans); outline: none; width: 100%;
  transition: all var(--transition);
}

.input:focus, .textarea:focus, .select:focus {
  border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg);
}

.textarea { resize: vertical; font-family: var(--font-mono); min-height: 60px; line-height: 1.5; }
.input-group { display: flex; align-items: center; gap: 6px; }
.input-group .input { flex: 1; }

/* === 标签页 === */
.tabs { display: flex; gap: 1px; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
.tab {
  padding: 6px 10px; cursor: pointer; color: var(--text-tertiary);
  font-size: 11px; font-weight: 500; border-bottom: 2px solid transparent;
  transition: all var(--transition);
}

.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* === 列表项 === */
.list-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-radius: 6px; cursor: pointer; transition: all var(--transition);
  border: 1px solid transparent;
}

.list-item:hover { background: var(--bg-hover); }
.list-item.active { background: var(--accent-bg); border-color: var(--accent); }

.list-item-icon {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0; background: var(--bg-tertiary);
}

.list-item-content { flex: 1; min-width: 0; }
.list-item-title { font-size: 12px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item-subtitle { font-size: 10px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

.list-item-actions { display: flex; gap: 3px; opacity: 0; transition: opacity var(--transition); }
.list-item:hover .list-item-actions { opacity: 1; }

/* === 空状态 === */
.empty-state { text-align: center; padding: 30px 20px; color: var(--text-tertiary); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; opacity: 0.3; }
.empty-state .empty-text { font-size: 12px; }

/* === 加载动画 === */
.spinner {
  width: 16px; height: 16px; border: 2px solid var(--border-light);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* === 模态框 === */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
  z-index: 9000; animation: fadeIn 0.12s ease;
}

.modal {
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); width: 90%; max-width: 520px; max-height: 80vh;
  display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
}

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border-color);
}

.modal-title { font-size: 14px; font-weight: 600; }
.modal-body { flex: 1; overflow-y: auto; padding: 16px; }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 6px;
  padding: 10px 16px; border-top: 1px solid var(--border-color);
}

/* === Toast === */
.toast-container {
  position: fixed; bottom: 16px; right: 16px; z-index: 10000;
  display: flex; flex-direction: column; gap: 6px;
}

.toast {
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: 8px; padding: 8px 14px; display: flex; align-items: center;
  gap: 8px; font-size: 11px; box-shadow: var(--shadow-md);
  animation: slideIn 0.25s ease; max-width: 320px;
}

.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }
.toast.warning { border-left: 3px solid var(--warning); }

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* === 开关 === */
.switch {
  position: relative; width: 32px; height: 18px;
  background: var(--bg-tertiary); border-radius: 9px;
  cursor: pointer; transition: background var(--transition); flex-shrink: 0;
}

.switch.on { background: var(--accent); }
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%; background: #fff;
  transition: transform var(--transition);
}

.switch.on::after { transform: translateX(14px); }

/* === 工具类 === */
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-1 { gap: 4px; }.gap-2 { gap: 8px; }.gap-3 { gap: 12px; }.gap-4 { gap: 16px; }
.flex-1 { flex: 1; }.flex-wrap { flex-wrap: wrap; }
.text-sm { font-size: 11px; }.text-xs { font-size: 10px; }
.text-muted { color: var(--text-tertiary); }
.text-secondary { color: var(--text-secondary); }
.text-accent { color: var(--accent); }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-warning { color: var(--warning); }
.text-info { color: var(--info); }
.text-purple { color: var(--purple); }
.font-mono { font-family: var(--font-mono); }
.font-bold { font-weight: 600; }
.mt-1 { margin-top: 4px; }.mt-2 { margin-top: 8px; }.mt-3 { margin-top: 12px; }.mt-4 { margin-top: 16px; }
.mb-1 { margin-bottom: 4px; }.mb-2 { margin-bottom: 8px; }.mb-3 { margin-bottom: 12px; }.mb-4 { margin-bottom: 16px; }
.p-2 { padding: 8px; }.p-3 { padding: 12px; }.p-4 { padding: 16px; }
.w-full { width: 100%; }.text-center { text-align: center; }
.cursor-pointer { cursor: pointer; }
.user-select-text { user-select: text; }
.break-all { word-break: break-all; }
.hidden { display: none !important; }

/* === 会话历史页面 === */
.sessions-layout { display: flex; gap: 12px; height: 100%; }
.sessions-main { flex: 1; min-width: 0; overflow-y: auto; }
.sessions-detail {
  width: 400px; flex-shrink: 0; background: var(--bg-secondary);
  border: 1px solid var(--border-color); border-radius: var(--radius-md);
  display: flex; flex-direction: column; overflow: hidden;
  position: relative;
}

.sessions-detail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}

.sessions-detail-info { padding: 10px 14px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }

.detail-info-row {
  display: flex; align-items: flex-start; gap: 8px; padding: 2px 0; font-size: 10px;
}

.detail-info-label { color: var(--text-tertiary); min-width: 55px; flex-shrink: 0; }
.detail-info-value { color: var(--text-secondary); word-break: break-all; }
.sessions-detail-messages { flex: 1; overflow-y: auto; padding: 10px 14px; }
.sessions-stats { display: flex; gap: 5px; flex-wrap: wrap; }

.session-group-header {
  font-size: 10px; font-weight: 600; color: var(--text-tertiary);
  padding: 8px 4px 4px; border-top: 1px solid var(--border-color); margin-top: 4px;
}

.session-item { cursor: pointer; }

/* === 会话历史 — 项目折叠 === */
.sessions-toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0; margin-bottom: 4px;
}

.sessions-stats-bar {
  display: flex; gap: 5px; flex-wrap: wrap;
  margin-bottom: 8px;
}

.session-project {
  margin-bottom: 2px;
}

.session-project-header {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 8px; cursor: pointer;
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: 6px; font-size: 11px; font-weight: 600;
  color: var(--text-secondary); transition: all var(--transition);
}

.session-project-header:hover { background: var(--bg-hover); }
.session-project-arrow { font-size: 8px; color: var(--text-tertiary); width: 10px; }
.session-project-icon { font-size: 12px; }
.session-project-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-project-count {
  background: var(--accent-bg); color: var(--accent);
  padding: 1px 6px; border-radius: 8px; font-size: 10px;
}

.session-project-body { padding: 2px 0 2px 12px; }

.session-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 5px; cursor: pointer;
  transition: all var(--transition); margin: 1px 0;
}

.session-item:hover { background: var(--bg-hover); }
.session-item.active { background: var(--accent-bg); }

.session-item-icon { font-size: 12px; flex-shrink: 0; opacity: 0.6; }
.session-item-content { flex: 1; min-width: 0; }
.session-item-title { font-size: 11px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item-subtitle { font-size: 9px; color: var(--text-tertiary); margin-top: 1px; }

/* === 会话详情统计 === */
.sessions-detail {
  width: 400px; flex-shrink: 0;
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden;
}

.sessions-detail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}

.sessions-detail-stats {
  padding: 10px 12px; max-height: 300px; overflow-y: auto;
}

.detail-stat-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px;
}

.detail-stat {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 6px 2px; background: var(--bg-tertiary); border-radius: 5px;
}

.detail-stat-val { font-size: 11px; font-weight: 600; color: var(--text-primary); }
.detail-stat-label { font-size: 8px; color: var(--text-tertiary); }

.detail-token-breakdown { margin-bottom: 8px; }

.token-bar-row, .tool-bar-row {
  display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 10px;
}

.token-label, .tool-name {
  width: 50px; color: var(--text-tertiary); flex-shrink: 0; text-align: right;
}

.token-bar-bg, .tool-bar-bg {
  flex: 1; height: 10px; background: var(--bg-tertiary); border-radius: 5px; overflow: hidden;
}

.token-bar { height: 100%; border-radius: 5px; transition: width 0.3s; }
.token-bar-input { background: var(--accent); }
.token-bar-output { background: var(--success); }
.token-bar-cache { background: var(--purple); }

.token-val, .tool-val {
  width: 50px; color: var(--text-secondary); font-size: 9px; flex-shrink: 0;
}

.tool-bar { height: 100%; background: var(--warning); border-radius: 5px; transition: width 0.3s; }

.detail-tool-list { margin-bottom: 8px; }
.detail-tool-title { font-size: 10px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }

.detail-cost, .detail-models {
  font-size: 10px; color: var(--text-tertiary); padding: 2px 0;
}

.sessions-detail-messages {
  flex: 1; overflow-y: auto; padding: 10px 12px;
}

.detail-timeline { display: flex; flex-direction: column; gap: 8px; }

.sessions-detail-chart { padding: 8px 12px; }
.chart-container { background: var(--bg-tertiary); border-radius: 6px; padding: 8px; }
.chart-title { font-size: 10px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.chart-axis { display: flex; justify-content: space-between; font-size: 8px; color: var(--text-muted); margin-top: 2px; }
.detail-path { font-size: 10px; color: var(--text-tertiary); padding: 2px 0; word-break: break-all; font-family: var(--font-mono); }

/* === 可折叠分区 === */
.collapsible-section { flex-shrink: 0; border-bottom: 1px solid var(--border-color); }
.collapsible-header {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 12px; cursor: pointer; font-size: 10px; font-weight: 600;
  color: var(--text-secondary); background: var(--bg-tertiary);
  transition: all var(--transition); user-select: none;
}
.collapsible-header:hover { color: var(--text-primary); background: var(--bg-hover); }
.collapsible-arrow { font-size: 8px; color: var(--text-tertiary); width: 10px; }
.collapsible-body { padding: 0; }

/* === 可调分栏 === */
.sessions-layout { position: relative; }
.sessions-main { min-width: 200px; }
.sessions-detail { min-width: 280px; }
.resize-handle {
  width: 4px; cursor: col-resize; background: transparent; flex-shrink: 0;
  transition: background var(--transition);
}
.resize-handle:hover { background: var(--accent); }

/* === 右键菜单 === */
.ctx-menu {
  position: fixed; z-index: 8000;
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: 8px; padding: 4px; min-width: 160px;
  box-shadow: var(--shadow-lg); animation: fadeIn 0.1s ease;
}
.ctx-menu-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 5px; cursor: pointer;
  font-size: 12px; color: var(--text-secondary);
  transition: all var(--transition);
}
.ctx-menu-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.ctx-menu-item.danger:hover { background: var(--danger-bg); color: var(--danger); }
.ctx-menu-divider { height: 1px; background: var(--border-color); margin: 2px 0; }

/* === 最佳实践 === */
.tips-container { max-width: 800px; margin: 0 auto; }
.tips-list { display: flex; flex-direction: column; gap: 8px; }
.tip-item { padding: 10px 12px; background: var(--bg-tertiary); border-radius: 6px; border-left: 3px solid var(--accent); }
.tip-item-title { font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
.tip-item-desc { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }

/* === 侧边栏展开图标 === */
.sidebar-toggle span { font-size: 12px; color: var(--text-tertiary); }

/* === 最佳实践可交互 === */
.tip-item {
  padding: 10px 12px; background: var(--bg-tertiary); border-radius: 6px;
  border-left: 3px solid var(--accent); cursor: text; user-select: text;
  transition: border-color var(--transition);
}
.tip-item:hover { border-left-color: var(--purple); }
.tip-item-title { font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; user-select: text; }
.tip-item-desc { font-size: 11px; color: var(--text-secondary); line-height: 1.5; user-select: text; }

/* === 网关信息卡片 === */
.gateway-card {
  display: flex; flex-direction: column; gap: 8px;
}
.gateway-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; background: var(--bg-tertiary); border-radius: 6px;
  font-size: 11px;
}
.gateway-label { color: var(--text-tertiary); }
.gateway-value { color: var(--text-primary); font-family: var(--font-mono); }
.gateway-balance {
  font-size: 16px; font-weight: 700; color: var(--success);
}

/* === 可拖拽分隔条 === */
.split-divider {
  width: 4px; cursor: col-resize; background: transparent;
  flex-shrink: 0; position: relative; z-index: 5;
}
.split-divider::after {
  content: ""; position: absolute; top: 50%; left: 1px;
  width: 2px; height: 30px; background: var(--border-light);
  border-radius: 1px; transform: translateY(-50%);
}
.split-divider:hover::after { background: var(--accent); }

/* 最大化详情面板 */
.sessions-detail.maximized { width: 100% !important; flex: 1 !important; }

/* === 检查器面板 — 内联可折叠 === */
.sessions-detail-inspector { padding: 8px 12px; max-height: 300px; overflow-y: auto; }

.inspector-header {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-bottom: 1px solid var(--border-color);
}

.inspector-body { padding: 8px 12px; }

.inspector-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 3px 0; font-size: 10px;
}

.inspector-label {
  color: var(--text-tertiary); min-width: 50px; flex-shrink: 0; text-align: right;
}

.inspector-value {
  color: var(--text-secondary); word-break: break-all;
}

.inspector-section {
  font-size: 10px; font-weight: 600; color: var(--text-secondary);
  margin-top: 8px; margin-bottom: 3px; padding-bottom: 2px;
  border-bottom: 1px solid var(--border-color);
}

.inspector-token-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px;
}

.inspector-token {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 4px 2px; background: var(--bg-secondary); border-radius: 4px;
}

.inspector-token-val {
  font-size: 11px; font-weight: 600; color: var(--text-primary);
}

.inspector-token-val.accent { color: var(--accent); }

.inspector-token-label { font-size: 8px; color: var(--text-tertiary); }

.inspector-preview, .inspector-json, .inspector-raw {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary);
  background: var(--bg-primary); padding: 6px 8px; border-radius: 4px;
  white-space: pre-wrap; word-break: break-all; user-select: text;
  max-height: 150px; overflow-y: auto; margin: 2px 0;
}

.inspector-json { max-height: 100px; }
.inspector-raw { max-height: 200px; }

/* === Markdown 渲染样式 === */
.md-content { font-size: 12px; line-height: 1.6; }
.md-content h1, .md-content .md-h1 { font-size: 16px; font-weight: 700; margin: 8px 0 4px; }
.md-content h2, .md-content .md-h2 { font-size: 15px; font-weight: 700; margin: 8px 0 4px; }
.md-content h3, .md-content .md-h3 { font-size: 14px; font-weight: 600; margin: 6px 0 3px; }
.md-content h4, .md-content .md-h4 { font-size: 13px; font-weight: 600; margin: 4px 0 2px; }
.md-content .md-p { margin: 4px 0; }
.md-content strong { font-weight: 700; color: var(--text-primary); }
.md-content em { font-style: italic; }
.md-content .md-inline-code {
  font-family: var(--font-mono); font-size: 11px;
  background: var(--bg-tertiary); padding: 1px 4px; border-radius: 3px;
  color: var(--accent);
}
.md-content .md-code-block {
  font-family: var(--font-mono); font-size: 11px;
  background: var(--bg-primary); padding: 8px 10px; border-radius: 6px;
  overflow-x: auto; margin: 6px 0; border: 1px solid var(--border-color);
}
.md-content .md-code-block code { color: var(--text-primary); white-space: pre; }
.md-content .md-ul { margin: 4px 0 4px 16px; padding: 0; list-style: disc; }
.md-content .md-ul li { margin: 2px 0; }
.md-content .md-quote {
  border-left: 3px solid var(--accent); padding: 4px 8px;
  background: var(--accent-bg); border-radius: 0 4px 4px 0; margin: 4px 0;
  color: var(--text-secondary);
}
.md-content .md-link { color: var(--accent); text-decoration: underline; }
.md-content .md-hr { border: none; border-top: 1px solid var(--border-color); margin: 8px 0; }
.md-content .md-table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 11px; }
.md-content .md-th, .md-content .md-td {
  border: 1px solid var(--border-color); padding: 4px 8px; text-align: left;
}
.md-content .md-th { background: var(--bg-tertiary); font-weight: 600; }

/* === AskUserQuestion 交互卡片 === */
.ask-user-card {
  background: var(--warning-bg); border: 1px solid var(--warning);
  border-radius: 8px; padding: 10px 12px; margin: 4px 0;
}
.ask-user-title {
  font-size: 12px; font-weight: 700; color: var(--warning); margin-bottom: 6px;
}
.ask-user-question { margin-bottom: 8px; }
.ask-user-q-header {
  font-size: 11px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px;
}
.ask-user-option {
  display: flex; align-items: center; gap: 4px; padding: 3px 6px;
  border-radius: 4px; font-size: 11px; color: var(--text-secondary);
}
.ask-user-option:hover { background: var(--bg-hover); }
.ask-user-radio { color: var(--accent); }
.ask-user-label { font-weight: 500; }
.ask-user-desc { font-size: 9px; color: var(--text-tertiary); }
.ask-user-placeholder { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }

/* === 交互式问题卡片 === */
.chat-msg-question .chat-msg-avatar { background: var(--warning-bg); }
.ask-user-options { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.ask-user-hint { font-size: 9px; color: var(--text-muted); margin-top: 4px; }

/* === 选择卡片选中态 === */
.ask-user-option.selected {
  background: var(--accent-bg) !important;
}
.ask-user-option.selected .ask-user-radio {
  color: var(--accent);
}
/* ============================================================
   对话界面样式 — 左侧项目侧边栏 + 右侧对话
   ============================================================ */

.chat-layout {
  display: flex;
  height: 100%;
  overflow: hidden;
}

/* === 项目侧边栏 === */
.chat-sidebar {
  width: 200px;
  flex-shrink: 0;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chat-sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
}

.chat-sidebar-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}

.chat-sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px;
}

.chat-sidebar-empty {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  padding: 20px 10px;
  line-height: 1.6;
}

/* 项目分组 */
.proj-group { margin-bottom: 2px; }

.proj-group-header {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-secondary);
  transition: all var(--transition);
}

.proj-group-header:hover { background: var(--bg-hover); }
.proj-group.expanded .proj-group-header { background: var(--bg-tertiary); color: var(--text-primary); }
.proj-group-icon { font-size: 12px; opacity: 0.8; }
.proj-group-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.proj-group-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--warning);
  animation: pulse 1.5s ease-in-out infinite;
  flex-shrink: 0;
}

.proj-group-close {
  width: 16px; height: 16px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; opacity: 0; transition: all var(--transition);
  flex-shrink: 0;
}

.proj-group-header:hover .proj-group-close { opacity: 0.5; }
.proj-group-close:hover { background: var(--danger); color: #fff; opacity: 1 !important; }

/* 项目下的会话列表 */
.proj-group-body { display: none; padding-left: 8px; }
.proj-group.expanded .proj-group-body { display: block; }

.proj-session-new {
  padding: 4px 8px; font-size: 11px; color: var(--accent);
  cursor: pointer; border-radius: 4px; transition: all var(--transition);
  margin: 2px 0;
}

.proj-session-new:hover { background: var(--accent-bg); }

.proj-session-item {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 8px; border-radius: 4px; cursor: pointer;
  transition: all var(--transition); margin: 1px 0;
}

.proj-session-item:hover { background: var(--bg-hover); }
.proj-session-icon { font-size: 10px; opacity: 0.6; flex-shrink: 0; }
.proj-session-title { flex: 1; font-size: 10px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-session-item:hover .proj-session-title { color: var(--text-primary); }
.proj-session-time { font-size: 9px; color: var(--text-muted); flex-shrink: 0; }

/* === 对话主区域 === */
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

/* === 消息区 === */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 20px;
  min-height: 0;
}

.chat-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; min-height: 200px;
}

.chat-empty-icon { font-size: 42px; margin-bottom: 12px; opacity: 0.3; }
.chat-empty-title { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.chat-empty-desc { font-size: 12px; color: var(--text-tertiary); }

/* 消息行 */
.chat-msg {
  display: flex; gap: 10px; margin-bottom: 14px;
  animation: msgIn 0.2s ease;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.chat-msg-avatar {
  width: 28px; height: 28px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0; background: var(--bg-tertiary);
}

.chat-msg-user .chat-msg-avatar { background: var(--accent-bg); }
.chat-msg-assistant .chat-msg-avatar { background: var(--purple-bg); }
.chat-msg-tool .chat-msg-avatar { background: var(--warning-bg); }
.chat-msg-result .chat-msg-avatar { background: var(--success-bg); }

.chat-msg-bubble {
  max-width: 78%; padding: 9px 13px; border-radius: 11px;
  font-size: 13px; line-height: 1.6; word-break: break-word; user-select: text;
}

/* 用户消息 — 右侧对齐，浅色背景 */
.chat-msg-user {
  flex-direction: row-reverse;
}
.chat-msg-user .chat-msg-avatar { order: 2; background: var(--accent-bg); }
.chat-msg-bubble-user {
  background: var(--bg-tertiary); color: var(--text-primary);
  border: 1px solid var(--border-light); border-bottom-right-radius: 4px;
}

/* statusline */
.chat-statusline {
  font-size: 10px; color: var(--text-tertiary);
  padding: 3px 12px; background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0; font-family: var(--font-mono);
  user-select: text;
}

.chat-msg-bubble-assistant { background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); border-bottom-left-radius: 4px; }
.chat-msg-text { white-space: pre-wrap; }

/* Markdown 内容覆盖 — 确保文字在所有气泡中都清晰可读 */
.chat-msg-bubble .md-content,
.chat-msg-bubble .md-p,
.chat-msg-bubble .md-h1, .chat-msg-bubble .md-h2, .chat-msg-bubble .md-h3,
.chat-msg-bubble .md-h4, .chat-msg-bubble .md-h5, .chat-msg-bubble .md-h6 {
  color: var(--text-primary) !important;
}
.chat-msg-bubble .md-inline-code {
  background: var(--bg-primary); color: var(--accent);
}
.chat-msg-bubble .md-code-block {
  background: var(--bg-primary); border: 1px solid var(--border-color);
}
.chat-msg-bubble .md-code-block code { color: var(--text-primary); }
.chat-msg-bubble .md-quote {
  border-left: 3px solid var(--accent); background: var(--bg-primary);
  color: var(--text-secondary);
}
.chat-msg-bubble .md-table .md-th { background: var(--bg-tertiary); color: var(--text-primary); }
.chat-msg-bubble .md-table .md-td { color: var(--text-secondary); }
.chat-msg-bubble strong { color: var(--text-primary); }
.chat-msg-bubble .md-link { color: var(--accent); }

.chat-msg-system { text-align: center; font-size: 11px; color: var(--text-tertiary); padding: 3px 12px; margin-bottom: 6px; user-select: text; }
.chat-msg-meta { text-align: right; font-size: 10px; color: var(--text-muted); margin-bottom: 10px; user-select: text; }

/* 打字动画 */
.chat-typing-dots { display: flex; gap: 4px; padding: 3px 0; }
.chat-typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary); animation: typingDot 1.2s ease-in-out infinite; }
.chat-typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.chat-typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingDot {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

/* === 输入区 === */
.chat-input-area {
  flex-shrink: 0; background: var(--bg-secondary);
  border-top: 1px solid var(--border-color);
  padding: 10px 16px 8px; position: relative;
}

.chat-input-wrapper {
  display: flex; gap: 8px; align-items: flex-end;
  background: var(--bg-input); border: 1px solid var(--border-color);
  border-radius: 11px; padding: 5px 5px 5px 12px;
  transition: border-color var(--transition);
}

.chat-input-wrapper:focus-within { border-color: var(--accent); }

.chat-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text-primary); font-family: var(--font-sans);
  font-size: 13px; line-height: 1.5; resize: none;
  min-height: 22px; max-height: 120px; padding: 4px 0;
}

.chat-input::placeholder { color: var(--text-muted); }

.chat-send-btn {
  width: 30px; height: 30px; padding: 0; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}

.chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 命令触发按钮 */
.chat-cmd-toggle {
  width: 30px; height: 30px; border: none; border-radius: 7px;
  background: var(--bg-tertiary); color: var(--text-secondary);
  font-size: 14px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}

.chat-cmd-toggle:hover { background: var(--accent-bg); color: var(--accent); }
.chat-cmd-toggle.active { background: var(--accent); color: #fff; }

/* 模型选择器 */
.chat-model-select {
  background: var(--bg-tertiary); border: 1px solid var(--border-color);
  border-radius: 6px; padding: 3px 6px; color: var(--text-secondary);
  font-size: 10px; font-family: var(--font-sans); outline: none;
  cursor: pointer; flex-shrink: 0; transition: all var(--transition);
}

.chat-model-select:hover { border-color: var(--accent); color: var(--accent); }
.chat-model-select:focus { border-color: var(--accent); }

/* 命令弹窗 — 全屏覆盖层 */
.cmd-popup-overlay {
  display: none; position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.4); z-index: 5000;
  flex-direction: column; justify-content: flex-end;
  animation: overlayIn 0.15s ease;
}

@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
.cmd-popup-overlay.show { display: flex; }

.cmd-popup-overlay .cmd-popup-header {
  background: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
  padding: 10px 16px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}

.cmd-popup-overlay .cmd-popup-title { font-size: 14px; font-weight: 600; color: var(--text-primary); white-space: nowrap; }

.cmd-popup-overlay .cmd-popup-search {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border-color);
  border-radius: 8px; padding: 6px 12px; color: var(--text-primary);
  font-size: 13px; outline: none;
}

.cmd-popup-overlay .cmd-popup-search:focus { border-color: var(--accent); }

.cmd-popup-close {
  width: 28px; height: 28px; border: none; border-radius: 6px;
  background: var(--bg-tertiary); color: var(--text-secondary);
  font-size: 14px; cursor: pointer; flex-shrink: 0;
}

.cmd-popup-close:hover { background: var(--danger); color: #fff; }

.cmd-popup-overlay .cmd-popup-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px; overflow-y: auto; padding: 4px;
  background: var(--bg-primary); max-height: 50vh;
}

/* 命令卡片 */
.cmd-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 6px; background: var(--bg-secondary); border-radius: 6px;
  cursor: pointer; transition: all var(--transition); text-align: center;
}

.cmd-item:hover { background: var(--accent-bg); }
.cmd-item:active { transform: scale(0.95); }
.cmd-item-icon { font-size: 20px; line-height: 1; }
.cmd-item-name { font-size: 11px; font-weight: 600; color: var(--text-primary); font-family: var(--font-mono); white-space: nowrap; }
.cmd-item:hover .cmd-item-name { color: var(--accent); }
.cmd-item-desc {
  font-size: 9px; color: var(--text-tertiary); line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; max-height: 24px;
}

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* === 多标签栏 === */
.chat-tabs-bar {
  display: flex; align-items: center; gap: 1px; padding: 0 4px; height: 32px;
  background: var(--bg-secondary); border-bottom: 1px solid var(--border-color);
  flex-shrink: 0; overflow-x: auto; scrollbar-width: thin;
}
.chat-tabs-bar::-webkit-scrollbar { height: 2px; }

.chat-tab {
  display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 26px;
  border-radius: 5px; cursor: pointer; font-size: 11px; color: var(--text-tertiary);
  white-space: nowrap; flex-shrink: 0; transition: all var(--transition);
  border: 1px solid transparent;
}
.chat-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
.chat-tab.active { background: var(--bg-primary); color: var(--text-primary); border-color: var(--border-color); }
.chat-tab-status { font-size: 8px; }
.chat-tab-name { font-weight: 500; }
.chat-tab-msgs { font-size: 9px; background: var(--bg-tertiary); padding: 1px 4px; border-radius: 8px; }
.chat-tab.active .chat-tab-msgs { background: var(--accent-bg); color: var(--accent); }
.chat-tab-close {
  width: 14px; height: 14px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; opacity: 0; transition: all var(--transition);
}
.chat-tab:hover .chat-tab-close { opacity: 0.5; }
.chat-tab-close:hover { background: var(--danger); color: #fff; opacity: 1 !important; }

/* 消息区域容器 */
.chat-panes-container { flex: 1; overflow: hidden; position: relative; min-height: 0; }
.active-pane { display: block; }
.chat-messages.active-pane { height: 100%; }

/* === 终端模拟器样式 === */
.term-view-container {
  display: flex; flex-direction: column; height: 100%;
  background: var(--bg-primary);
}

.term-view-toolbar {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 8px; background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}

.term-view-tabs {
  display: flex; gap: 1px; flex: 1; overflow-x: auto; scrollbar-width: thin;
}
.term-view-tabs::-webkit-scrollbar { height: 2px; }

.term-view-tab {
  display: flex; align-items: center; gap: 4px; padding: 0 8px;
  height: 26px; border-radius: 5px; cursor: pointer; font-size: 11px;
  color: var(--text-tertiary); white-space: nowrap; flex-shrink: 0;
  border: 1px solid transparent; transition: all var(--transition);
}
.term-view-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
.term-view-tab.active { background: var(--bg-primary); color: var(--text-primary); border-color: var(--border-color); }

.term-view-tab-close {
  width: 16px; height: 16px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; opacity: 0.4; transition: all var(--transition);
  margin-left: 2px;
}
.term-view-tab:hover .term-view-tab-close { opacity: 0.6; }
.term-view-tab-close:hover { background: var(--danger); color: #fff; opacity: 1 !important; }
.term-view-tab-name { max-width: 80px; overflow: hidden; text-overflow: ellipsis; }

.term-view-body {
  flex: 1; overflow: hidden; display: flex; flex-direction: column;
}

.term-view-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--text-tertiary);
}
.term-view-empty-icon { font-size: 40px; opacity: 0.3; margin-bottom: 8px; }
.term-view-empty-text { font-size: 12px; }

.term-view-output {
  flex: 1; overflow-y: auto; padding: 8px 12px;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.5;
  color: var(--text-primary); background: var(--bg-primary);
  user-select: text; white-space: pre-wrap; word-break: break-word;
  outline: none; cursor: text;
}

.term-view-output .term-stdout { color: var(--text-primary); }
.term-view-output .term-stderr { color: var(--danger); }
.term-view-output .term-command { color: var(--green); }
.term-view-output .term-muted { color: var(--text-muted); }

.term-view-input-area {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--bg-secondary);
  border-top: 1px solid var(--border-color); flex-shrink: 0;
}

.term-view-prompt {
  color: var(--accent); font-family: var(--font-mono);
  font-size: 13px; flex-shrink: 0; font-weight: 700;
}

.term-view-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text-primary); font-family: var(--font-mono);
  font-size: 13px; min-width: 0;
}

/* 当前会话高亮 */
.proj-session-item.current-session {
  background: var(--accent-bg);
  border-left: 2px solid var(--accent);
}
.proj-session-item.current-session .proj-session-title {
  color: var(--accent);
  font-weight: 600;
}

/* 终端输出区 — 直接输入模式 */
.term-view-output {
  flex: 1; overflow-y: auto; padding: 8px 12px;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.5;
  color: var(--text-primary); background: #0d1117;
  user-select: text; white-space: pre-wrap; word-break: break-word;
  outline: none; cursor: text;
}

/* 终端光标 */
.term-cursor {
  display: inline-block; width: 8px; height: 14px;
  background: var(--text-primary); margin-left: 1px;
  animation: term-cursor-blink 1s step-end infinite;
  vertical-align: text-bottom;
}
@keyframes term-cursor-blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* contenteditable 终端 — 防止编辑产生的 DOM 节点 */
.term-view-output[contenteditable] {
  -webkit-user-modify: read-write;
  caret-color: transparent; /* 隐藏 contenteditable 的光标，用自定义光标 */
  outline: none;
}
.term-view-output[contenteditable] br { display: none; }
.term-view-output[contenteditable] div { display: none; }

/* 内联光标 — 跟随文字位置 */
.term-inline-cursor {
  display: inline-block; width: 7px; height: 14px;
  background: var(--text-primary); vertical-align: text-bottom;
  animation: term-cursor-blink 1s step-end infinite;
  margin-left: 1px;
}
